<script>
/* Free access codes (we only count how many people use the materials).
   Pages other than the home, access and certificate pages need an access code once per browser;
   the code is requested on access.html and checked by the Neudata portal. */
(function () {
  var KEY = "neudata-cdar-access";
  var open = ["", "index.html", "access.html", "certificate.html", "404.html"];
  var page = location.pathname.split("/").pop();
  var ok;
  try { ok = !!localStorage.getItem(KEY); } catch (e) { ok = true; }   // storage blocked: never lock people out
  if (!ok && open.indexOf(page) < 0) {
    document.documentElement.style.visibility = "hidden";
    location.replace("access.html?next=" + encodeURIComponent(page + location.search + location.hash));
  }
})();
</script>
