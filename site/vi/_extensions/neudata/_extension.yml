title: Neudata slides
author: Neudata Consulting Ltd
version: 1.0.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    revealjs:
      theme: [default, neudata-slides.scss]
      width: 1600
      height: 900
      margin: 0.06
      logo: neudata-logo.png
      footer: "Neudata &nbsp;|&nbsp; #ClearDataClearImpact"
      slide-number: c
      show-slide-number: all
      transition: fade
      transition-speed: fast
      center: false
      hash-type: number
      code-line-numbers: false
      highlight-style: github
      template-partials:
        - title-slide.html
      filters:
        - neudata-slides.lua
      format-resources:
        - neudata-logo.png
      execute:
        echo: true
        warning: false
        message: false
